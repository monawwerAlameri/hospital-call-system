# ============================================================
#  Render Blueprint — Hospital Call System v3.1
#  ----------------------------------------------------------------
#  This file allows one-click deployment on Render.
#  Repo is public at: https://github.com/monawwerAlameri/hospital-call-system
#  Pre-configured with Aiven MySQL credentials — only DB_PASS
#  needs to be entered by the user at deploy time.
# ============================================================
services:
  - type: web
    name: hospital-call-system
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health.php
    autoDeploy: true
    envVars:
      # Aiven MySQL Service Configuration
      # Pre-filled for one-click deploy
      - key: DB_HOST
        value: hospital-call-system-nermenaalameri-1446.a.aivencloud.com
      - key: DB_PORT
        value: "23366"
      - key: DB_USER
        value: avnadmin
      - key: DB_PASS
        sync: false  # User will be prompted to enter this at deploy time
      - key: DB_NAME
        value: defaultdb
      - key: DB_SSL
        value: "1"
